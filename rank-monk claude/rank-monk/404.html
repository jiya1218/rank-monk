<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Rank Monk</title>
  <meta name="description" content="This page could not be found.">
  <link rel="icon" href="img/logo.png">
  <script>
    /* set theme before paint to avoid a flash */
    try {
      var t = localStorage.getItem("rankmonk-theme") ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="site-header"></div>

<main class="container notfound">
  <div>
    <div class="code">404</div>
    <h1 style="margin-top:10px">This page <span class="accent">wandered off</span>.</h1>
    <p class="lead" style="margin:14px auto 30px">The link may be broken, or the page may have moved. Let's get you back on the climb.</p>
    <div class="hero-actions" style="justify-content:center">
      <a class="btn btn-primary" href="index.html">Back to home</a>
      <a class="btn btn-ghost" href="blog.html">Read the journal</a>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<script src="js/main.js"></script>
</body>
</html>
