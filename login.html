<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In · Rank Monk OS</title>
  <meta name="description" content="Sign in to your Rank Monk OS console. Autonomous organic visibility, blog drafting, AEO radar and headless SEO crawling.">
  <link rel="icon" type="image/png" href="assets/favicon-32x32.png">

  <!-- Immediate Theme & Fallback State Initializer (Runs before anything else) -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('rankmonk-theme');
        var theme = saved || 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();

    // Resilient Fallback State Store (Guarantees RankMonkState is NEVER undefined)
    window.RankMonkState = window.RankMonkState || {
      demoLogin: function() {
        var demoUser = {
          name: 'Jane Doe',
          email: 'jane.doe@acme.com',
          plan: 'grow'
        };
        try {
          localStorage.setItem('rankmonk_active_user_v3', JSON.stringify(demoUser));
          var raw = localStorage.getItem('rankmonk_engine_state_v3');
          if (raw) {
            var parsed = JSON.parse(raw);
            parsed.currentUser = demoUser;
            localStorage.setItem('rankmonk_engine_state_v3', JSON.stringify(parsed));
          }
        } catch (e) {}
        return demoUser;
      },
      login: async function(email, password) {
        var user = {
          name: email ? email.split('@')[0] : 'Jane Doe',
          email: email || 'founder@company.com',
          plan: 'grow'
        };
        try {
          localStorage.setItem('rankmonk_active_user_v3', JSON.stringify(user));
          var raw = localStorage.getItem('rankmonk_engine_state_v3');
          if (raw) {
            var parsed = JSON.parse(raw);
            parsed.currentUser = user;
            localStorage.setItem('rankmonk_engine_state_v3', JSON.stringify(parsed));
          }
        } catch (e) {}
        return user;
      },
      getCurrentUser: function() {
        try {
          var u = localStorage.getItem('rankmonk_active_user_v3');
          if (u) return JSON.parse(u);
        } catch (e) {}
        return { name: 'Jane Doe', email: 'jane.doe@acme.com', plan: 'grow' };
      }
    };

    // Instant One-Click Login Action (Accessible inline from any button)
    function quickLogin() {
      try {
        var demoUser = {
          name: 'Jane Doe',
          email: 'jane.doe@acme.com',
          plan: 'grow'
        };
        localStorage.setItem('rankmonk_active_user_v3', JSON.stringify(demoUser));
        if (window.RankMonkState && typeof window.RankMonkState.demoLogin === 'function') {
          window.RankMonkState.demoLogin();
        }
      } catch (e) {}
      var hasOnboarded = localStorage.getItem('rankmonk_has_onboarded');
      window.location.href = hasOnboarded ? 'dashboard' : 'onboarding';
    }

    // Prefill helper for testing
    function prefillDemoCredentials() {
      var e = document.getElementById('loginEmail');
      var p = document.getElementById('loginPassword');
      if (e) e.value = 'jane.doe@acme.com';
      if (p) p.value = 'ZenMaster2026!';
    }
  </script>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="auth-page">

  <!-- Top Auth Nav -->
  <header class="auth-nav">
    <a href="index.html" class="brand" aria-label="Rank Monk home">
      <img src="assets/rank-monk-logo-horizontal.png" alt="Rank Monk" class="brand-logo-img logo-light">
      <img src="assets/rank-monk-logo-horizontal-light.png" alt="Rank Monk" class="brand-logo-img logo-dark">
    </a>

    <div style="display: flex; align-items: center; gap: 14px;">
      <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle theme">◑</button>
      <a href="index.html" class="btn btn-secondary" style="font-size: 0.85rem; padding: 8px 16px;">← Back to Site</a>
    </div>
  </header>

  <!-- Centered Luxury Auth Box -->
  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-eyebrow">Rank Monk OS · Console Access</div>
      <h1>Enter the <span style="font-style: italic; font-family: var(--font-heading); color: var(--tan);">Sanctuary</span></h1>
      <p class="auth-sub">Continuous, quiet organic visibility handled by autonomous loops.</p>

      <!-- Instant 1-Click Demo Login Banner -->
      <div class="demo-access-banner" style="cursor: pointer;" onclick="quickLogin()">
        <div class="demo-access-info">
          <span class="icon">✨</span>
          <div class="txt">
            Instant Demo Access
            <span>Jane Doe · Grow Plan (₹20,000/mo)</span>
          </div>
        </div>
        <button id="demoLoginBtn" class="btn-demo-quick" type="button" onclick="event.stopPropagation(); quickLogin();">
          Enter Demo →
        </button>
      </div>

      <!-- Auth Form -->
      <form id="loginForm" class="auth-form" onsubmit="handleLoginSubmit(event)">
        <div class="auth-field">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
            <label for="loginEmail" style="margin-bottom: 0;">Work Email</label>
            <button type="button" onclick="prefillDemoCredentials()" style="background: none; border: none; color: #b98b6a; font-size: 0.76rem; font-weight: 700; cursor: pointer; padding: 0; text-decoration: underline;">
              ⚡ Fill Demo Account
            </button>
          </div>
          <input type="email" id="loginEmail" required placeholder="founder@company.com" autocomplete="email">
        </div>

        <div class="auth-field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required placeholder="••••••••••••" autocomplete="current-password">
        </div>

        <div class="auth-meta">
          <label class="auth-remember">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember this device</span>
          </label>
          <a href="#" class="auth-forgot" onclick="alert('Password reset instructions will be sent to your work email.'); return false;">Forgot password?</a>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn-auth-submit">
          <span>Sign In to Console</span>
          <span>→</span>
        </button>

        <div id="authErrorMsg" style="display:none; color: #d9534f; font-size: 0.85rem; text-align: center; margin-top: 6px;"></div>
      </form>

      <div class="auth-divider">Or continue with</div>

      <button type="button" class="btn-social-auth" onclick="quickLogin()">
        <svg width="18" height="18" viewBox="0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.28v3.15C3.27 21.36 7.33 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.28C.46 8.2 0 10.04 0 12s.46 3.8 1.28 5.42l4-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.27 2.64 1.28 6.58l4 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
        <span>Continue with Google Workspace</span>
      </button>

      <p class="auth-footer-text">
        New to Rank Monk? <a href="signup.html">Start 14-day trial →</a>
      </p>
    </div>
  </main>

  <!-- Cache-busting script load -->
  <script src="js/rankmonk-state.js?v=20261023_rev5"></script>
  <script>
    // Theme Switcher
    const themeBtn = document.getElementById('themeToggleBtn');
    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const cur = document.documentElement.getAttribute('data-theme') || 'light';
        const next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('rankmonk-theme', next);
      });
    }

    // Form Submit Handler
    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = (document.getElementById('loginEmail')?.value || '').trim() || 'founder@company.com';
      const pass = (document.getElementById('loginPassword')?.value || '').trim() || 'password123';
      const errBox = document.getElementById('authErrorMsg');
      const btn = document.getElementById('loginSubmitBtn');

      if (errBox) errBox.style.display = 'none';
      if (btn) {
        btn.innerHTML = '<span>Verifying credentials...</span>';
        btn.style.opacity = '0.75';
      }

      try {
        const user = {
          name: email.split('@')[0],
          email: email,
          plan: 'grow'
        };
        localStorage.setItem('rankmonk_active_user_v3', JSON.stringify(user));

        if (window.RankMonkState && typeof window.RankMonkState.login === 'function') {
          try {
            await window.RankMonkState.login(email, pass);
          } catch (syncErr) {
            console.warn('[RankMonk] Remote sync skipped, session activated locally:', syncErr);
          }
        }
        const hasOnboarded = localStorage.getItem('rankmonk_has_onboarded');
        window.location.href = hasOnboarded ? 'dashboard' : 'onboarding';
      } catch (err) {
        const hasOnboarded = localStorage.getItem('rankmonk_has_onboarded');
        window.location.href = hasOnboarded ? 'dashboard' : 'onboarding';
      }
    }

    function handleGoogleLogin() {
      quickLogin();
    }
  </script>
</body>
</html>
